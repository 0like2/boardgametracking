# 인스타 피드 포스트 스펙
#
#   python make_insta.py posts/example.yaml
#
# 게임 이름만 맞으면 영문명·커버·난이도·평점·인원·시간·소개글은 자동으로 채워집니다.
# 이름은 띄어쓰기나 콜론이 달라도 찾습니다 ("브라스 버밍엄" → "브라스: 버밍엄").

# ---------------------------------------------------------------- 후기
- type: review
  game: 브라스 버밍엄
  # photo: photos/brass_0729.jpg   # 없으면 커버 이미지로 대체됩니다
  date: 2026-07-29
  duration: 150 # 실제 걸린 시간 (없으면 게임 기본 시간)
  ranking: # 1등부터 순서대로. 5명까지 깔끔하게 들어갑니다
    - { name: 영락, score: 178, note: 철도 몰빵 }
    - { name: 지훈, score: 165 }
    - { name: 민서, score: 151 }
    - { name: 재현, score: 140 }
  review: >
    2차 철도 시대에 맥주가 말라버려서 다 같이 멈췄다. 초반에 운하를 덜 깔면
    후반이 통째로 꼬인다는 걸 배운 판.

# ---------------------------------------------------------------- 소개
- type: intro
  game: 아크 노바
  # kicker, intro, tags 를 안 쓰면 보드라이프 소개글과 테마·진행방식이 들어갑니다
  kicker: 동물원을 짓는 헤비 전략
  tags: [카드 드래프트, 타일 배치, 엔진 빌딩]

# ---------------------------------------------------------------- 간단 규칙
- type: rules
  game: 스컬킹
  steps: # 3~5개 권장
    - title: 라운드마다 카드를 늘려 받는다
      desc: 1라운드에 1장, 10라운드에 10장까지. 받은 패를 보고 시작합니다.
    - title: 몇 트릭을 먹을지 선언한다
      desc: 모두 동시에 손가락으로 공개합니다. 0을 부를 수도 있습니다.
    - title: 선언한 만큼 정확히 먹는다
      desc: 정확히 맞히면 트릭당 20점, 하나라도 틀리면 차이만큼 감점입니다.
    - title: 특수 카드로 판을 뒤집는다
      desc: 해적은 마법사에게 지고, 인어는 마법사를 잡습니다.
  win: 10라운드 뒤 총점이 가장 높은 사람이 승리
